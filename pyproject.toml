[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderag"
version = "0.1.0"
description = "Agentic AI-powered GitHub repository assistant using RAG, FAISS, and Gemini."
readme = "README.md"
requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "vasudev1876961" }
]

dependencies = [
    "faiss-cpu>=1.8.0.post1,<1.9",
    "numpy>=1.26,<2",
    "openai>=1.44,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.38,<2",
    "tenacity>=8.5,<9",
    "watchdog>=4.0,<5",
    "sentence-transformers>=2.7.0",
    "networkx>=3.3",
    "GitPython>=3.1.43",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.3",
]

[project.scripts]
coderag-cli = "coderag.cli:main"

[tool.black]
line-length = 88
target-version = ["py311"]

include = '\.pyi?$'

extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | env
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["coderag"]

[tool.mypy]
python_version = "3.11"

ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false

warn_unused_ignores = false
warn_redundant_casts = false

disable_error_code = [
    "var-annotated",
    "union-attr",
    "assignment",
    "return-value",
    "index"
]

exclude = [
    "\\.venv",
    "build",
    "dist"
]